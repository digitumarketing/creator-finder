<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Creator Finder{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: { 950: '#0b0f19', 900: '#111827', 800: '#1f2937', 700: '#374151' },
            accent: { DEFAULT: '#8b5cf6', soft: '#a78bfa', dark: '#6d28d9' },
            mint: '#34d399',
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-ink-950 text-slate-100 antialiased font-sans">
  <div class="min-h-full flex flex-col">
    <header class="border-b border-white/5 bg-ink-900/80 backdrop-blur sticky top-0 z-40">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 group">
          <span class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-fuchsia-500 flex items-center justify-center text-sm font-bold shadow-lg shadow-accent/20">CF</span>
          <span class="font-semibold tracking-tight text-slate-100 group-hover:text-white">Creator Finder</span>
        </a>
        <nav class="flex items-center gap-1 text-sm">
          <a href="/scrape" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-white/5 {% if request.url.path in ['/', '/scrape'] %}bg-white/10 text-white{% endif %}">New scrape</a>
          <a href="/jobs" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-white/5 {% if request.url.path.startswith('/jobs') %}bg-white/10 text-white{% endif %}">Jobs</a>
          <a href="/keys" class="px-3 py-1.5 rounded-md text-slate-300 hover:text-white hover:bg-white/5 {% if request.url.path.startswith('/keys') %}bg-white/10 text-white{% endif %}">API keys</a>
        </nav>
      </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8">
      {% block content %}{% endblock %}
    </main>

    <footer class="border-t border-white/5 py-4 text-center text-xs text-slate-500">
      Local only · binds to 127.0.0.1 · keys stay in SQLite under <code class="text-slate-400">data/</code>
    </footer>
  </div>
</body>
</html>
